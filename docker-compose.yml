services:
  dzwonnica-sdr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dzwonnica-sdr
    restart: unless-stopped

    # Port mappings
    ports:
      # Publish the web UI and WebSockets on every host/LAN interface.
      - "0.0.0.0:9002:9002"

    # PlutoSDR normally uses this address over its USB Ethernet interface.
    # This also makes pluto.local work when Docker cannot forward host mDNS.
    extra_hosts:
      - "pluto.local:192.168.2.1"
    
    # Volume mappings for persistence and configuration
    volumes:
      # Configuration files (customize as needed)
      - ./config:/app/config
      # Logs persistence
      - ./logs:/app/logs
      # Data persistence
      - ./data:/app/data
    
    # PlutoSDR is reached over its USB Ethernet interface, so no raw USB
    # device mapping or privileged container access is required.
    
    # Environment variables
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      # OpenCL platform/device selection (optional)
      # - NOVASDR_OPENCL_PLATFORM=0
      # - NOVASDR_OPENCL_DEVICE=0
      # Vulkan device selection (optional, if built with vkfft)
      # - NOVASDR_VULKAN_DEVICE=0
    
    # Network mode (use host mode if having issues with device detection)
    # network_mode: host
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    
  # Optional: ws_probe utility for debugging WebSocket connections
  # Uncomment if you need to debug WebSocket issues
  # ws_probe:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: novasdr-ws-probe
  #   entrypoint: ["/app/ws_probe"]
  #   command: ["ws://novasdr:9002/ws"]
  #   depends_on:
  #     - novasdr
  #   network_mode: service:novasdr

# Optional: Networks configuration
networks:
  default:
    driver: bridge

# Optional: Volumes configuration for named volumes
# volumes:
#   novasdr_data:
#   novasdr_logs:
